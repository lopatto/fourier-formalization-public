status:
  scope: All principal conclusions in the local manuscript’s proved binary dyadic regime N=2^n, K=2^k
    are included, together with exact-decoder and complex-RIP consequences. Sampling independently
    includes each row; q is its expected cardinality. The finite results assume n>=256, k<=n and
    min(k,n-k)>=12 log_2 n, with c0=ln(2)/8; recovery/RIP uses fixed 0<delta<1. The sequence lower
    bound assumes eventual admissibility, diverging dimensions and success bounded away from zero.
    Prime-field and quoted introductory results are outside the advertised scope. No separate general-K
    or forall-real-alpha rounding corollary is claimed.
